{% extends "accounts/base.html" %}
{% block content %}
<h1>New Product</h1>
<form method="post">
{% csrf_token %}
<p><input name="name" placeholder="Product name" required></p>
<p><input name="price" type="number" step="0.01" placeholder="Price" required></p>
<button type="submit">Save</button>
</form>
{% endblock %}
